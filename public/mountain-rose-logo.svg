      <path d="M-13 78 C-23 62 -37 55 -58 57 C-48 42 -30 36 -12 45 C-1 50 5 61 -13 78Z" fill="url(#leaf)" opacity="0.82"/>
      <path d="M-4 87 C-2 73 5 65 17 58" fill="none" stroke="#5B4636" stroke-width="3" stroke-linecap="round"/>
      <path d="M-5 86 C-15 76 -25 69 -39 66" fill="none" stroke="#5B4636" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="translate(0 0)">
        <path d="M0 55 C-27 41 -30 15 -9 4 C1 -1 12 0 20 8 C31 19 25 43 0 55Z" fill="url(#petal)" stroke="#2B1A12" stroke-width="1.6"/>
        <path d="M-4 54 C-37 50 -52 27 -37 10 C-26 -3 -3 3 7 20 C14 32 10 43 -4 54Z" fill="#A35D6A" stroke="#2B1A12" stroke-width="1.45"/>
        <path d="M5 53 C30 54 49 37 44 17 C40 2 18 1 5 16 C-5 28 -5 43 5 53Z" fill="#7A2E3A" stroke="#2B1A12" stroke-width="1.45"/>
        <path d="M0 51 C-19 37 -20 17 -4 10 C8 5 22 12 24 25 C27 40 15 49 0 51Z" fill="#C89AA2" stroke="#2B1A12" stroke-width="1.35"/>
        <path d="M-1 47 C-12 38 -11 24 -1 19 C9 14 18 21 17 31 C16 41 8 46 -1 47Z" fill="#7A2E3A" stroke="#2B1A12" stroke-width="1.25"/>
        <path d="M-2 43 C2 34 9 30 17 30" fill="none" stroke="#2B1A12" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M-13 36 C-3 27 9 21 24 22" fill="none" stroke="#2B1A12" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>
        <path d="M-28 31 C-15 37 0 37 18 32" fill="none" stroke="#2B1A12" stroke-width="1" stroke-linecap="round" opacity="0.65"/>
      </g>
    </g>
  </g>

  <text x="180" y="154" text-anchor="middle" fill="#7A2E3A"
