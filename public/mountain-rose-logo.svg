<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title desc">
  <title id="title">Mountain Rose Leather Bag logo</title>
  <desc id="desc">A red rose above a connected Mountain Rose script wordmark with Leather Bag text.</desc>
  <defs>
    <linearGradient id="petal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#C89AA2"/>
      <stop offset="0.28" stop-color="#A35D6A"/>
      <stop offset="1" stop-color="#7A2E3A"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9C7A43"/>
      <stop offset="1" stop-color="#5B4636"/>
    </linearGradient>
    <filter id="softInk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.1" flood-color="#2B1A12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#softInk)">
