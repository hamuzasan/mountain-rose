  <path d="M86 158 C119 139 149 143 181 154 C213 166 246 167 285 149" fill="none" stroke="#A35D6A" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <text x="180" y="183" text-anchor="middle" fill="#2B1A12"
    font-family="Georgia, Times New Roman, serif"
    font-size="16" letter-spacing="7">
    LEATHER BAG
  </text>
